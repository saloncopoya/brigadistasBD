<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#0a0e1a" />
<title>Brigadistas BD · Rutas de Colectivos Tuxtla Gutiérrez</title>
<meta name="description" content="Consulta, explora y administra las rutas de colectivos de Tuxtla Gutiérrez, Chiapas. Mapa interactivo, GPS en tiempo real y funcionamiento offline." />
<meta name="robots" content="index,follow" />
<link rel="canonical" href="https://brigadistasbd.pages.dev/" />

<!-- Open Graph -->
<meta property="og:type" content="website" />
<meta property="og:title" content="Brigadistas BD · Rutas de Colectivos" />
<meta property="og:description" content="Encuentra cómo llegar usando colectivos en Tuxtla Gutiérrez. 100% offline." />
<meta property="og:url" content="https://brigadistasbd.pages.dev/" />
<meta property="og:image" content="https://brigadistasbd.pages.dev/assets/icon.svg" />

<!-- PWA -->
<link rel="manifest" href="/manifest.json" />
<link rel="apple-touch-icon" href="/assets/icon.svg" />
<link rel="icon" href="/assets/icon.svg" />

<!-- Leaflet -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<link rel="stylesheet" href="https://unpkg.com/leaflet-routing-machine@3.2.12/dist/leaflet-routing-machine.css" />

<!-- SweetAlert2 -->
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

<style>
:root{
  --cyan:#00e5ff; --cyan-dim:#00b8cc; --bg:#0a0e1a; --bg2:#111827; --bg3:#1a2235;
  --fg:#e6edf7; --fg-dim:#9aa7bd; --border:#1f2a44; --card:#131a2b;
  --green:#22c55e; --red:#ef4444; --yellow:#facc15; --purple:#a855f7;
  --radius:14px; --shadow:0 6px 24px rgba(0,0,0,.35);
}
html[data-theme="light"]{
  --bg:#f4f6fb; --bg2:#ffffff; --bg3:#eef2f8; --fg:#0f172a; --fg-dim:#64748b;
  --border:#d7deea; --card:#ffffff; --shadow:0 6px 20px rgba(0,0,0,.08);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%;background:var(--bg);color:var(--fg);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  overscroll-behavior-y:none}
body{padding-bottom:env(safe-area-inset-bottom)}
a{color:var(--cyan);text-decoration:none}
button,input,textarea,select{font-family:inherit;font-size:15px;color:var(--fg)}
button{cursor:pointer;border:none;background:none}
input,textarea,select{background:var(--bg3);border:1px solid var(--border);border-radius:10px;padding:11px 13px;width:100%;outline:none}
input:focus,textarea:focus,select:focus{border-color:var(--cyan);box-shadow:0 0 0 3px rgba(0,229,255,.15)}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:8px}

/* HEADER */
header.app-header{position:sticky;top:0;z-index:900;background:rgba(10,14,26,.85);backdrop-filter:blur(14px);
  border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px;padding:10px 14px}
html[data-theme="light"] header.app-header{background:rgba(244,246,251,.85)}
header .brand{font-weight:800;letter-spacing:.5px;font-size:17px;display:flex;align-items:center;gap:8px}
header .brand .dot{width:10px;height:10px;border-radius:50%;background:var(--cyan);box-shadow:0 0 12px var(--cyan)}
header .spacer{flex:1}
.icon-btn{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--bg3);border:1px solid var(--border);font-size:18px}
.icon-btn:hover{border-color:var(--cyan)}

/* MAIN */
main{max-width:1100px;margin:0 auto;padding:14px 14px 100px}
.page{display:none;animation:fade .25s ease}
.page.active{display:block}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* BOTTOM NAV */
nav.bottom-nav{position:fixed;bottom:0;left:0;right:0;z-index:950;background:rgba(10,14,26,.92);
  backdrop-filter:blur(14px);border-top:1px solid var(--border);
  display:grid;grid-template-columns:repeat(3,1fr);padding-bottom:env(safe-area-inset-bottom)}
html[data-theme="light"] nav.bottom-nav{background:rgba(255,255,255,.92)}
nav.bottom-nav button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:10px 4px;color:var(--fg-dim);font-size:11px;font-weight:600}
nav.bottom-nav button.active{color:var(--cyan)}
nav.bottom-nav button .em{font-size:20px;line-height:1}

/* CHIPS */
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.chip{padding:8px 14px;border-radius:20px;background:var(--bg3);border:1px solid var(--border);
  font-size:13px;font-weight:600;color:var(--fg-dim);white-space:nowrap}
.chip.active{background:var(--cyan);color:#001820;border-color:var(--cyan)}
.chip.tag-urbana{background:rgba(0,229,255,.12);color:var(--cyan);border-color:var(--cyan-dim)}
.chip.tag-foranea{background:rgba(168,85,247,.15);color:var(--purple);border-color:var(--purple)}

/* SEARCH */
.search-box{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:12px;margin-bottom:12px}
.search-box .row{display:flex;gap:8px;align-items:center}
.search-box .row+.row{margin-top:8px}
.search-box .field{position:relative;flex:1}
.search-box .field label{position:absolute;left:12px;top:8px;font-size:10px;color:var(--cyan);font-weight:700;text-transform:uppercase;letter-spacing:.5px}
.search-box .field input{padding-top:22px}
.suggestions{position:absolute;left:0;right:0;top:100%;margin-top:4px;background:var(--card);border:1px solid var(--border);
  border-radius:10px;max-height:220px;overflow-y:auto;z-index:500;box-shadow:var(--shadow);display:none}
.suggestions.open{display:block}
.suggestions div{padding:10px 12px;cursor:pointer;font-size:14px;border-bottom:1px solid var(--border)}
.suggestions div:last-child{border-bottom:none}
.suggestions div:hover{background:var(--bg3)}
.btn-primary{background:var(--cyan);color:#001820;font-weight:800;padding:12px;border-radius:10px;width:100%;letter-spacing:.4px}
.btn-secondary{background:var(--bg3);color:var(--fg);border:1px solid var(--border);font-weight:700;padding:12px;border-radius:10px}
.btn-secondary:hover{border-color:var(--cyan)}

/* MAP */
#map,#tripMap,#editMap{width:100%;height:60vh;min-height:340px;border-radius:var(--radius);border:1px solid var(--border);z-index:1}
.map-wrap{position:relative;margin-bottom:12px}
.map-actions{position:absolute;top:10px;right:10px;display:flex;gap:6px;z-index:800}
.map-actions button{width:38px;height:38px;border-radius:10px;background:var(--card);border:1px solid var(--border);font-size:16px;display:grid;place-items:center;box-shadow:var(--shadow)}

/* ROUTE GRID */
.route-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media(min-width:520px){.route-grid{grid-template-columns:repeat(4,1fr)}}
@media(min-width:760px){.route-grid{grid-template-columns:repeat(5,1fr)}}
@media(min-width:1024px){.route-grid{grid-template-columns:repeat(6,1fr)}}
.route-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:12px;position:relative;
  display:flex;flex-direction:column;gap:6px;transition:.15s;cursor:pointer}
.route-card:hover{border-color:var(--cyan);transform:translateY(-2px)}
.route-card .bus{font-size:22px}
.route-card .name{font-weight:800;font-size:13px;text-transform:uppercase;line-height:1.2;letter-spacing:.4px}
.route-card .actions{position:absolute;top:8px;right:8px;display:flex;gap:4px}
.route-card .actions button{width:26px;height:26px;border-radius:8px;background:var(--bg3);border:1px solid var(--border);font-size:12px}

/* POSTS FEED */
.post{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);margin-bottom:14px;overflow:hidden}
.post .head{display:flex;align-items:center;gap:10px;padding:12px 14px}
.post .head .avatar{width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,var(--cyan),var(--purple));display:grid;place-items:center;font-weight:800;color:#001820}
.post .head .meta{flex:1;min-width:0}
.post .head .meta b{font-size:14px}
.post .head .meta small{color:var(--fg-dim);font-size:11px;display:block}
.post .body{padding:0 14px 12px;font-size:14.5px;line-height:1.5;white-space:pre-wrap;word-break:break-word}
.post .media{width:100%;max-height:520px;background:#000;display:block;cursor:pointer;object-fit:cover}
.post .foot{display:flex;border-top:1px solid var(--border)}
.post .foot button{flex:1;padding:11px;font-size:13px;font-weight:700;color:var(--fg-dim);display:flex;align-items:center;justify-content:center;gap:6px}
.post .foot button:hover{color:var(--cyan)}
.post .foot button.liked{color:#ef4444}
@keyframes pop{0%{transform:scale(1)}45%{transform:scale(1.45)}100%{transform:scale(1)}}
.heart-pop{animation:pop .4s ease}

/* MARKET */
.market-grid{display:grid;grid-template-columns:repeat(1,1fr);gap:12px}
@media(min-width:560px){.market-grid{grid-template-columns:repeat(2,1fr)}}
@media(min-width:900px){.market-grid{grid-template-columns:repeat(3,1fr)}}
.market-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;display:flex;flex-direction:column}
.market-card .img{width:100%;aspect-ratio:16/10;background:#000;object-fit:cover;display:block;cursor:pointer}
.market-card .placeholder{width:100%;aspect-ratio:16/10;background:var(--bg3);display:grid;place-items:center;font-size:40px;color:var(--fg-dim)}
.market-card .info{padding:12px;display:flex;flex-direction:column;gap:6px;flex:1}
.market-card .title{font-weight:800;font-size:15px}
.market-card .price{color:var(--green);font-weight:800;font-size:17px}
.market-card .desc{font-size:13px;color:var(--fg-dim);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.market-card .actions{display:flex;gap:6px;margin-top:auto;padding-top:8px}
.market-card .actions button{flex:1;padding:9px;font-size:12px;font-weight:700;border-radius:9px;background:var(--bg3);border:1px solid var(--border)}
.market-card .actions button.wa{background:#25d366;color:#fff;border-color:#25d366}

/* MODAL */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:1000;display:none;align-items:flex-end;justify-content:center}
.modal.open{display:flex}
.modal .sheet{background:var(--card);width:100%;max-width:640px;border-radius:20px 20px 0 0;max-height:88vh;display:flex;flex-direction:column;animation:slideUp .25s ease}
@keyframes slideUp{from{transform:translateY(60px)}to{transform:none}}
.modal .handle{width:44px;height:5px;border-radius:5px;background:var(--border);margin:10px auto}
.modal .sheet h3{margin:0 16px 8px;font-size:16px}
.modal .sheet .scroll{overflow-y:auto;padding:0 16px 16px}
.modal .sheet .input-row{display:flex;gap:8px;padding:10px 16px;border-top:1px solid var(--border)}
.comment{display:flex;gap:8px;padding:8px 0;border-bottom:1px solid var(--border)}
.comment .av{width:32px;height:32px;border-radius:50%;background:var(--bg3);display:grid;place-items:center;font-size:14px;flex-shrink:0}
.comment .txt{flex:1;font-size:14px;line-height:1.4;word-break:break-word}
.comment .ops{display:flex;gap:6px;margin-top:4px}
.comment .ops button{font-size:11px;color:var(--fg-dim);padding:2px 6px;border-radius:6px;background:var(--bg3)}

/* FULLSCREEN VIEWER */
.viewer{position:fixed;inset:0;background:rgba(0,0,0,.94);z-index:1200;display:none;align-items:center;justify-content:center}
.viewer.open{display:flex}
.viewer img,.viewer video{max-width:100%;max-height:100%;object-fit:contain}
.viewer .close{position:absolute;top:14px;right:14px;width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.15);color:#fff;font-size:22px;display:grid;place-items:center}

/* DETAIL PANEL */
.detail-panel{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);margin-bottom:12px;overflow:hidden}
.detail-panel .head{padding:14px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px}
.detail-panel .head h2{margin:0;font-size:18px;flex:1}
.detail-block{padding:12px 14px;border-bottom:1px solid var(--border)}
.detail-block:last-child{border-bottom:none}
.detail-block h4{margin:0 0 8px;font-size:12px;color:var(--cyan);text-transform:uppercase;letter-spacing:.6px}
.detail-block .items{display:flex;flex-wrap:wrap;gap:6px}
.detail-block .items span{padding:5px 10px;background:var(--bg3);border:1px solid var(--border);border-radius:8px;font-size:12.5px;cursor:pointer}
.detail-block .items span:hover{border-color:var(--cyan)}

/* OFFLINE BADGE */
.offline-badge{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:#ef4444;color:#fff;
  padding:8px 16px;border-radius:20px;font-size:12px;font-weight:700;z-index:800;display:none;box-shadow:var(--shadow)}
.offline-badge.show{display:block}

/* ADMIN */
.admin-section{margin-bottom:20px}
.admin-section h3{margin:0 0 10px;font-size:14px;color:var(--cyan);text-transform:uppercase;letter-spacing:.6px}
.form-row{margin-bottom:12px}
.form-row label{display:block;font-size:12px;color:var(--fg-dim);margin-bottom:5px;font-weight:600}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.color-dots{display:flex;gap:8px;flex-wrap:wrap}
.color-dots button{width:32px;height:32px;border-radius:50%;border:2px solid transparent}
.color-dots button.active{border-color:#fff;box-shadow:0 0 0 2px var(--cyan)}
.progress{height:6px;background:var(--bg3);border-radius:6px;overflow:hidden;margin-top:6px}
.progress > div{height:100%;background:var(--cyan);width:0%;transition:width .3s}
.wizard-steps{display:flex;gap:6px;margin-bottom:14px}
.wizard-steps .step{flex:1;text-align:center;padding:8px 4px;font-size:11px;font-weight:700;border-radius:9px;background:var(--bg3);color:var(--fg-dim)}
.wizard-steps .step.active{background:var(--cyan);color:#001820}
.wizard-steps .step.done{background:var(--green);color:#fff}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:14px;margin-bottom:12px}
.empty{text-align:center;padding:40px 20px;color:var(--fg-dim)}
.empty .em{font-size:40px;display:block;margin-bottom:10px}
.hint{font-size:11.5px;color:var(--fg-dim);margin-top:4px}
</style>
</head>
<body>

<!-- ═══════════ HEADER ═══════════ -->
<header class="app-header">
  <div class="brand"><span class="dot"></span>Brigadistas BD</div>
  <div class="spacer"></div>
  <button class="icon-btn" id="installBtn" title="Instalar" style="display:none">⬇</button>
  <button class="icon-btn" id="themeBtn" title="Tema">🌙</button>
</header>

<!-- ═══════════ PÁGINA: RUTAS (INICIO POR DEFECTO) ═══════════ -->
<main>
  <section class="page active" id="page-routes">
    <div class="search-box">
      <div class="row">
        <div class="field">
          <label>Estoy en</label>
          <input id="originInput" placeholder="Ej. Parque Central" autocomplete="off"/>
          <div class="suggestions" id="originSugg"></div>
        </div>
      </div>
      <div class="row">
        <div class="field">
          <label>¿A dónde vamos?</label>
          <input id="destInput" placeholder="Ej. Hospital Gómez Maza" autocomplete="off"/>
          <div class="suggestions" id="destSugg"></div>
        </div>
      </div>
      <div class="row">
        <button class="btn-primary" id="searchBtn">🔍 BUSCAR RUTAS</button>
      </div>
      <div class="row">
        <button class="btn-secondary" id="clearBtn">Limpiar</button>
        <button class="btn-secondary" id="mapTripBtn">🗺️ Buscar por mapa</button>
      </div>
    </div>

    <div class="chips" id="modeChips">
      <button class="chip active" data-mode="rutas">🚌 Rutas</button>
      <button class="chip" data-mode="paradas">📍 Paradas</button>
      <button class="chip" data-mode="pois">🏥 POIs</button>
      <button class="chip" data-mode="calles">🛣️ Calles</button>
      <button class="chip" data-mode="retornos">↩️ Retornos</button>
    </div>

    <div id="routesList" class="route-grid"></div>
    <div id="routesEmpty" class="empty" style="display:none">
      <span class="em">🚌</span>
      <p>No hay rutas registradas todavía</p>
    </div>
    <div id="searchResults"></div>
  </section>

  <!-- ═══════════ PÁGINA: INICIO (POSTS) ═══════════ -->
  <section class="page" id="page-posts">
    <div id="postsFeed"></div>
    <div id="postsEmpty" class="empty" style="display:none">
      <span class="em">📝</span>
      <p>No hay publicaciones aún</p>
    </div>
  </section>

  <!-- ═══════════ PÁGINA: MARKETPLACE ═══════════ -->
  <section class="page" id="page-market">
    <input id="marketSearch" placeholder="🔍 Buscar en marketplace..." style="margin-bottom:10px"/>
    <div class="chips" id="marketCats">
      <button class="chip active" data-cat="all">Todo</button>
      <button class="chip" data-cat="auto">Auto/Camioneta</button>
      <button class="chip" data-cat="terreno">Terreno/Lote</button>
      <button class="chip" data-cat="casa">Casa/Renta</button>
      <button class="chip" data-cat="servicio">Servicio</button>
      <button class="chip" data-cat="otro">Otro</button>
    </div>
    <div class="market-grid" id="marketGrid"></div>
    <div id="marketEmpty" class="empty" style="display:none">
      <span class="em">🛒</span>
      <p>No hay anuncios todavía</p>
    </div>
  </section>

  <!-- ═══════════ PÁGINA: DETALLE RUTA ═══════════ -->
  <section class="page" id="page-route-detail">
    <button class="btn-secondary" id="backFromRoute" style="margin-bottom:10px">← Regresar</button>
    <div class="map-wrap">
      <div id="map"></div>
      <div class="map-actions">
        <button id="mapFullBtn" title="Pantalla completa">⛶</button>
        <button id="myLocBtn" title="Mi ubicación">🎯</button>
      </div>
    </div>
    <div class="detail-panel" id="routeDetail"></div>
  </section>

  <!-- ═══════════ PÁGINA: BUSCAR VIAJE POR MAPA ═══════════ -->
  <section class="page" id="page-trip-map">
    <button class="btn-secondary" id="backFromTrip" style="margin-bottom:10px">← Regresar</button>
    <div class="map-wrap">
      <div id="tripMap"></div>
      <div class="map-actions">
        <button id="tripLocBtn" title="Mi ubicación (A)">🎯</button>
        <button id="tripClearBtn" title="Limpiar puntos">🗑️</button>
      </div>
    </div>
    <div class="card">
      <label>Radio de búsqueda: <b id="radiusVal">200</b> m</label>
      <input type="range" id="radiusSlider" min="10" max="2000" value="200" step="10"/>
      <p class="hint">Toca el mapa para marcar puntos A, B, C… Los resultados se actualizan en tiempo real.</p>
      <button class="btn-primary" id="tripSearchBtn" style="margin-top:8px">🔍 Buscar rutas</button>
    </div>
    <div id="tripResults"></div>
  </section>

  <!-- ═══════════ PÁGINA: ADMIN (en /admin.html) ═══════════ -->
</main>

<!-- ═══════════ BOTTOM NAV ═══════════ -->
<nav class="bottom-nav">
  <button data-tab="routes" class="active"><span class="em">🚌</span>Rutas</button>
  <button data-tab="posts"><span class="em">🏠</span>Inicio</button>
  <button data-tab="market"><span class="em">🛒</span>Market</button>
</nav>

<div class="offline-badge" id="offlineBadge">⚠️ Sin conexión · viendo datos guardados</div>

<!-- ═══════════ MODAL COMENTARIOS ═══════════ -->
<div class="modal" id="commentsModal">
  <div class="sheet">
    <div class="handle" id="commentsHandle"></div>
    <h3>Comentarios (<span id="commentsCount">0</span>)</h3>
    <div class="scroll" id="commentsList"></div>
    <div class="input-row">
      <input id="commentInput" placeholder="Escribe un comentario..."/>
      <button class="btn-primary" id="commentSend" style="width:auto;padding:0 16px">➤</button>
    </div>
  </div>
</div>

<!-- ═══════════ VISOR FULLSCREEN ═══════════ -->
<div class="viewer" id="viewer">
  <button class="close" id="viewerClose">✕</button>
  <div id="viewerContent"></div>
</div>

<script type="module" src="/js/app.js"></script>
</body>
</html>
