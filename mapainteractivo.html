<style>
/* ============================================================
   VARIABLES Y TEMAS (idénticos a index.html)
   ============================================================ */
:root{
  --cyan:#00e5ff;
  --cyan-d:#00b8cc;
  --cyan-glow:rgba(0,229,255,.35);
  --purple:#a855f7;
  --green:#10b981;
  --amber:#f59e0b;
  --red:#ef4444;
  --pink:#ec4899;
  --radius:14px;
  --radius-sm:10px;
  --radius-lg:22px;
  --shadow:0 10px 30px rgba(0,0,0,.35);
  --shadow-sm:0 4px 12px rgba(0,0,0,.25);
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --nav-h:64px;
  --header-h:58px;
  --transition:.25s cubic-bezier(.4,0,.2,1);
}
[data-theme="dark"]{
  --bg:#0a0e1a;--bg-2:#0f1526;--bg-3:#161e33;--surface:#141c30;--surface-2:#1c2540;
  --surface-3:#242f4d;--border:#26314f;--border-2:#334066;--text:#e8edf7;--text-2:#a9b4cc;
  --text-3:#6b7793;--input-bg:#0f1626;--overlay:rgba(5,8,16,.85);--map-filter:none;
}
[data-theme="light"]{
  --bg:#f4f6fb;--bg-2:#ffffff;--bg-3:#eef1f8;--surface:#ffffff;--surface-2:#f4f6fb;
  --surface-3:#e8ecf5;--border:#dde3ee;--border-2:#c5cfe2;--text:#0c1322;--text-2:#4a5773;
  --text-3:#8a95ad;--input-bg:#f8fafd;--overlay:rgba(15,20,35,.55);--map-filter:none;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  font-family:var(--font);background:var(--bg);color:var(--text);overflow-x:hidden;
  overscroll-behavior-y:none;transition:background var(--transition),color var(--transition);
  -webkit-font-smoothing:antialiased;
}
button,input,textarea,select{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer;border:none;background:none}
a{color:var(--cyan);text-decoration:none}
img{max-width:100%;display:block}
.hidden{display:none!important}
::selection{background:var(--cyan);color:#00121a}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border-2);border-radius:8px}
::-webkit-scrollbar-thumb:hover{background:var(--cyan-d)}

/* HEADER (idéntico) */
.header{
  position:fixed;top:0;left:0;right:0;height:var(--header-h);
  background:color-mix(in srgb,var(--surface) 92%,transparent);
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  border-bottom:1px solid var(--border);display:flex;align-items:center;
  justify-content:space-between;padding:0 14px;z-index:1000;
}
.header-brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:17px;letter-spacing:-.3px}
.header-brand .logo{
  width:32px;height:32px;border-radius:9px;
  background:linear-gradient(135deg,var(--cyan),var(--cyan-d));
  display:grid;place-items:center;color:#00121a;font-size:17px;
  box-shadow:0 0 18px var(--cyan-glow);
}
.header-brand .logo svg{width:20px;height:20px}
.header-brand .brand-txt{background:linear-gradient(90deg,var(--cyan),#7dd3fc);-webkit-background-clip:text;background-clip:text;color:transparent}
.header-actions{display:flex;align-items:center;gap:6px}
.icon-btn{
  width:40px;height:40px;border-radius:11px;display:grid;place-items:center;
  color:var(--text-2);transition:var(--transition);position:relative;
}
.icon-btn:hover{background:var(--surface-2);color:var(--cyan)}
.icon-btn:active{transform:scale(.92)}
.icon-btn svg{width:20px;height:20px}

/* LAYOUT */
.app{padding-top:var(--header-h);padding-bottom:calc(var(--nav-h) + env(safe-area-inset-bottom));min-height:100vh}
.container{max-width:1100px;margin:0 auto;padding:14px}

/* NAV INFERIOR (idéntico) */
.bottom-nav{
  position:fixed;bottom:0;left:0;right:0;height:calc(var(--nav-h) + env(safe-area-inset-bottom));
  padding-bottom:env(safe-area-inset-bottom);
  background:color-mix(in srgb,var(--surface) 96%,transparent);
  backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
  border-top:1px solid var(--border);display:grid;grid-template-columns:repeat(3,1fr);z-index:1000;
}
.nav-item{
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  color:var(--text-3);font-size:11px;font-weight:600;transition:var(--transition);position:relative;
}
.nav-item svg{width:23px;height:23px;transition:var(--transition)}
.nav-item.active{color:var(--cyan)}
.nav-item.active svg{transform:translateY(-2px) scale(1.08)}
.nav-item.active::before{
  content:"";position:absolute;top:6px;width:44px;height:3px;border-radius:0 0 4px 4px;
  background:var(--cyan);box-shadow:0 0 14px var(--cyan-glow);
}
.nav-item:active{transform:scale(.94)}

/* ============================================================
   TRIP SEARCH (idéntico a index.html)
   ============================================================ */
.trip-controls{
  background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
  padding:10px;margin-bottom:10px;display:flex;flex-direction:column;gap:8px;
}
.trip-controls-row{
  display:flex;gap:8px;align-items:flex-end;flex-wrap:wrap;
}
.trip-controls-row .trip-radius-box{flex:2;min-width:140px}
.trip-controls-row .trip-transfers-box{flex:1;min-width:110px}
.trip-controls-row label{font-size:11px;font-weight:700;color:var(--text-2);display:block;margin-bottom:3px;}
.trip-controls-row input[type="range"]{width:100%;accent-color:var(--cyan)}
.trip-controls-row .select{padding:7px 28px 7px 10px;font-size:12px}
.trip-points-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px;}
.trip-points-grid .trip-point-card{
  background:var(--surface-2);border:1px solid var(--border);border-radius:8px;
  padding:6px 8px;display:flex;align-items:center;gap:6px;font-size:11px;min-width:0;
}
.trip-points-grid .trip-point-card .tpc-letter{
  width:24px;height:24px;border-radius:50%;display:grid;place-items:center;
  color:#fff;font-weight:800;font-size:12px;flex-shrink:0;
}
.trip-points-grid .trip-point-card .tpc-coords{
  flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  color:var(--text);font-size:12px;font-weight:800;letter-spacing:.2px;
}
.trip-points-grid .trip-point-card .tpc-actions{display:flex;gap:2px;flex-shrink:0}
.trip-points-grid .trip-point-card .tpc-actions button{
  width:20px;height:20px;border-radius:5px;background:var(--surface-3);
  display:grid;place-items:center;color:var(--text-2);font-size:11px;
}
.trip-points-grid .trip-point-card .tpc-actions button:hover{color:var(--red)}
.trip-points-grid .empty-trip{
  grid-column:1/-1;text-align:center;padding:14px 10px;font-size:12.5px;
  color:var(--text-2);font-weight:600;line-height:1.5;
  border:1px dashed var(--border-2);border-radius:10px;background:var(--surface-2);
}

/* MAPA */
.map-wrap{position:relative;border-radius:var(--radius);overflow:hidden;border:1px solid var(--border);background:var(--surface-2)}
#tripMap{width:100%;height:40vh;min-height:260px;z-index:1}
.map-toolbar-below{
  position:absolute;left:12px;bottom:12px;z-index:600;display:flex;gap:5px;padding:4px;
  background:color-mix(in srgb,var(--surface) 96%,transparent);
  border:1px solid var(--border-2);border-radius:10px;
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  box-shadow:var(--shadow);
}
.map-toolbar-below .tb{
  width:34px;height:28px;justify-content:center;align-items:center;
  background:var(--surface-2);border:1px solid var(--border);border-radius:8px;
  color:var(--text);display:flex;transition:var(--transition);padding:0;
}
.map-toolbar-below .tb.tb-text{width:auto;padding:0 10px;gap:5px;}
.map-toolbar-below .tb.tb-text span{font-size:10.5px;font-weight:800;letter-spacing:.3px;color:inherit;line-height:1;}
.map-toolbar-below .tb svg{width:14px;height:14px}
.map-toolbar-below .tb:hover{border-color:var(--cyan);color:var(--cyan)}
.map-toolbar-below .tb.active{background:var(--cyan);color:#00121a;border-color:transparent}

.map-fs-btn{
  position:absolute;bottom:12px;right:12px;z-index:600;
  background:color-mix(in srgb,var(--surface) 96%,transparent);
  border:1px solid var(--border-2);border-radius:12px;
  width:42px;height:42px;display:grid;place-items:center;
  color:var(--text);box-shadow:var(--shadow);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  transition:var(--transition);cursor:pointer;
}
.map-fs-btn:hover{background:var(--surface-3);border-color:var(--cyan);color:var(--cyan)}
.map-fs-btn:active{transform:scale(.94)}
.map-fs-btn svg{width:20px;height:20px}
.map-wrap.is-fullscreen{
  position:fixed !important;inset:0 !important;z-index:9500 !important;
  margin:0 !important;border-radius:0 !important;border:none !important;
}
.map-wrap.is-fullscreen #tripMap{height:100vh !important;width:100vw !important;}
body.fs-active{overflow:hidden !important}

.leaflet-container{background:var(--bg-2)!important;font-family:var(--font)!important}
.leaflet-control-zoom a{background:var(--surface)!important;color:var(--text)!important;border-color:var(--border)!important}
.leaflet-control-attribution{background:color-mix(in srgb,var(--surface) 88%,transparent)!important;color:var(--text-2)!important;font-size:10px!important}
.leaflet-control-attribution a{color:var(--cyan)!important}
.leaflet-popup-content-wrapper{background:var(--surface-3)!important;color:var(--text)!important;border-radius:12px!important;border:1px solid var(--border-2)!important}
.leaflet-popup-tip{background:var(--surface-3)!important}
.leaflet-interactive:focus,.leaflet-interactive:focus-visible,.leaflet-interactive:active{outline:none!important;outline-width:0!important;box-shadow:none!important;-webkit-tap-highlight-color:transparent!important}
.leaflet-container svg:focus,.leaflet-container svg:focus-visible,.leaflet-container svg path:focus,.leaflet-container svg path:focus-visible{outline:none!important;outline-width:0!important;-webkit-tap-highlight-color:transparent!important}

.marker-a,.marker-b,.marker-c,.marker-d,.marker-e{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:12px;color:#fff;border:2.5px solid #fff;box-shadow:0 2px 10px rgba(0,0,0,.5)}
.marker-a{background:#10b981}.marker-b{background:#ef4444}.marker-c{background:#f59e0b}.marker-d{background:#3b82f6}.marker-e{background:#a855f7}

/* Resultados */
.trip-result-actions{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap;}
.trip-result-actions .btn{padding:6px 10px;font-size:11.5px}
.trip-badge-route{display:inline-block;padding:2px 7px;border-radius:99px;font-size:10px;font-weight:800;color:#fff;margin-right:4px;}
.trip-chain{display:flex;flex-wrap:wrap;align-items:center;gap:4px;padding:0;margin-bottom:4px;}
.trip-chain-item{display:inline-flex;align-items:center;gap:6px;padding:4px 8px 4px 4px;background:var(--surface-2);border:1px solid var(--border);border-radius:10px;}
.trip-chain-chip{width:22px;height:22px;border-radius:6px;display:grid;place-items:center;color:#fff;font-weight:800;font-size:11px;flex-shrink:0;box-shadow:0 2px 6px rgba(0,0,0,.25);}
.trip-chain-name{font-size:12.5px;font-weight:700;color:var(--text);text-transform:uppercase;letter-spacing:.2px;white-space:nowrap;}
.trip-chain-sep{color:var(--text-3);font-weight:800;font-size:16px;margin:0 2px;line-height:1;}

/* Botones y tarjetas */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 16px;border-radius:var(--radius-sm);font-weight:700;font-size:13.5px;transition:var(--transition);border:1px solid transparent;}
.btn svg{width:17px;height:17px}
.btn:active{transform:scale(.96)}
.btn-primary{background:linear-gradient(135deg,var(--cyan),var(--cyan-d));color:#00121a;box-shadow:0 6px 18px -6px var(--cyan-glow)}
.btn-primary:hover{filter:brightness(1.08);box-shadow:0 8px 22px -6px var(--cyan-glow)}
.btn-ghost{background:var(--surface-2);color:var(--text);border-color:var(--border)}
.btn-ghost:hover{background:var(--surface-3);border-color:var(--border-2)}
.btn-sm{padding:8px 12px;font-size:12.5px}

.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px;transition:var(--transition);}
.card:hover{border-color:var(--border-2)}
.section-title{font-size:15px;font-weight:800;letter-spacing:.3px;margin:18px 0 10px;display:flex;align-items:center;gap:8px;color:var(--text);}
.section-title svg{width:18px;height:18px;color:var(--cyan)}

.result-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px;margin-bottom:10px;transition:var(--transition);cursor:pointer;}
.result-card:hover{border-color:var(--cyan);box-shadow:var(--shadow-sm)}
.result-card.directa{border-left:3px solid var(--green)}
.result-card.transbordo{border-left:3px solid var(--amber)}
.result-card.warn{border-left:3px solid var(--amber);background:color-mix(in srgb,var(--amber) 6%,var(--surface))}
.result-card .rc-head{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.result-card .rc-head .rc-icon{width:36px;height:36px;border-radius:9px;background:var(--surface-2);display:grid;place-items:center;color:var(--cyan)}
.result-card .rc-head .rc-icon svg{width:20px;height:20px}
.result-card .rc-route{font-weight:800;font-size:14px;text-transform:uppercase}
.result-card .rc-sub{font-size:11.5px;color:var(--text-3)}
.result-card .rc-body{font-size:13px;color:var(--text-2);line-height:1.5}
.result-card .rc-steps{margin-top:8px;display:flex;flex-direction:column;gap:6px}
.rc-step{display:flex;gap:8px;font-size:12.5px;padding:8px 10px;background:var(--surface-2);border-radius:8px}
.rc-step .step-num{width:20px;height:20px;border-radius:50%;background:var(--cyan);color:#00121a;display:grid;place-items:center;font-weight:800;font-size:11px;flex-shrink:0}

.badge{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:99px;font-size:10.5px;font-weight:800;letter-spacing:.4px;text-transform:uppercase}
.badge-green{background:color-mix(in srgb,var(--green) 16%,transparent);color:var(--green);border:1px solid color-mix(in srgb,var(--green) 30%,transparent)}
.badge-amber{background:color-mix(in srgb,var(--amber) 18%,transparent);color:var(--amber);border:1px solid color-mix(in srgb,var(--amber) 32%,transparent)}

.empty{text-align:center;padding:40px 20px;color:var(--text-3)}
.empty svg{width:56px;height:56px;margin-bottom:12px;opacity:.4}
.empty h3{font-size:15px;margin-bottom:6px;color:var(--text-2)}
.empty p{font-size:13px;max-width:300px;margin:0 auto}

.toast-wrap{position:fixed;top:calc(var(--header-h) + 10px);left:50%;transform:translateX(-50%);z-index:9999;display:flex;flex-direction:column;gap:8px;pointer-events:none;width:calc(100% - 24px);max-width:400px}
.toast{background:var(--surface-3);color:var(--text);padding:12px 16px;border-radius:var(--radius-sm);border:1px solid var(--border-2);box-shadow:var(--shadow);font-size:13.5px;font-weight:600;display:flex;align-items:center;gap:10px;pointer-events:auto;animation:toastIn .3s cubic-bezier(.4,0,.2,1);}
.toast.ok{border-color:color-mix(in srgb,var(--green) 50%,transparent)}
.toast.err{border-color:color-mix(in srgb,var(--red) 50%,transparent)}
.toast svg{width:18px;height:18px;flex-shrink:0}
.toast.ok svg{color:var(--green)}
.toast.err svg{color:var(--red)}
@keyframes toastIn{from{opacity:0;transform:translateY(-14px)}to{opacity:1;transform:none}}

/* Responsive */
@media(min-width:720px){.container{max-width:900px}}
@media(min-width:1000px){.app{max-width:1200px;margin:0 auto}.bottom-nav{max-width:560px;left:50%;transform:translateX(-50%);border-radius:18px 18px 0 0;border-left:1px solid var(--border);border-right:1px solid var(--border)}#tripMap{height:60vh}}
@media(max-width:380px){.map-toolbar-below .tb{width:28px;height:24px}.map-toolbar-below .tb svg{width:12px;height:12px}.trip-points-grid{grid-template-columns:1fr}.header-brand .brand-txt{font-size:14px}}
</style>
</head>
<body>

<!-- HEADER -->
<header class="header">
  <div class="header-brand">
    <div class="logo">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/>
        <circle cx="12" cy="10" r="3"/>
      </svg>
    </div>
    <span class="brand-txt">Rutas BGD</span>
  </div>
  <div class="header-actions">
    <button class="icon-btn" id="themeBtn" title="Cambiar tema">
      <svg id="themeIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
    </button>
    <a class="icon-btn" href="/" title="Ir al inicio">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
    </a>
  </div>
</header>

<!-- APP -->
<main class="app">
  <div class="container">
    <div class="share-row" id="tripShareRow" style="display:flex;gap:8px;margin-bottom:10px">
      <a class="btn btn-ghost btn-sm" href="/">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
        Regresar
      </a>
      <button class="btn btn-primary btn-sm" id="tripShareBtn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/></svg>
        Compartir viaje
      </button>
    </div>

    <!-- Controles -->
    <div class="trip-controls">
      <div class="trip-controls-row">
        <div class="trip-radius-box">
          <label>Radio de busqueda: <span id="tripRadiusVal">300</span>m</label>
          <input type="range" id="tripRadius" min="10" max="2000" value="300" step="10">
        </div>
        <div class="trip-transfers-box">
          <label>Máx. transbordos:</label>
          <select class="select" id="tripMaxTransfers">
            <option value="1" selected>1 transbordo</option>
            <option value="2">2 transbordos</option>
            <option value="3">3 transbordos</option>
            <option value="4">4 transbordos</option>
          </select>
        </div>
        <button class="btn btn-primary btn-sm" id="btnTripSearch">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          Buscar
        </button>
      </div>
      <div id="tripPointsList" class="trip-points-grid"></div>
    </div>

    <!-- Mapa -->
    <div class="map-wrap" id="tripMapWrap">
      <div id="tripMap"></div>
      <div class="map-toolbar-below" id="tripToolbar">
        <button class="tb tb-text" data-tool="undo" title="Deshacer">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 14 4 9 9 4"/><path d="M20 20v-7a4 4 0 0 0-4-4H4"/></svg>
          <span>DESHACER</span>
        </button>
        <button class="tb active" data-tool="addpoint" title="Agregar punto">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        </button>
        <button class="tb" data-tool="locate" title="Mi ubicación">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg>
        </button>
        <button class="tb tb-text" data-tool="clear" title="Limpiar todo">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
          <span>LIMPIAR MAPA</span>
        </button>
      </div>
      <button class="map-fs-btn" id="tripMapFsBtn" title="Pantalla completa">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M8 3H5a2 2 0 0 0-2 2v3"/><path d="M21 8V5a2 2 0 0 0-2-2h-3"/><path d="M3 16v3a2 2 0 0 0 2 2h3"/><path d="M16 21h3a2 2 0 0 0 2-2v-3"/></svg>
      </button>
    </div>

    <!-- Resultados -->
    <div id="tripResults" style="margin-top:14px"></div>
  </div>
</main>
