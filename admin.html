<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
<meta charset="UTF-8"/>

<title>Admin · Brigadistas BD</title>
<link rel="icon" href="/assets/icon.svg"/>

<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<style>
:root{--cyan:#00e5ff;--bg:#0a0e1a;--bg2:#131a2b;--bg3:#1a2235;--fg:#e6edf7;--fg-dim:#9aa7bd;--border:#1f2a44;--green:#22c55e;--red:#ef4444;--purple:#a855f7;--radius:14px}
html[data-theme="light"]{--bg:#f4f6fb;--bg2:#fff;--bg3:#eef2f8;--fg:#0f172a;--fg-dim:#64748b;--border:#d7deea}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;padding-bottom:40px}
header{position:sticky;top:0;z-index:900;background:rgba(10,14,26,.9);backdrop-filter:blur(12px);border-bottom:1px solid var(--border);padding:12px 16px;display:flex;align-items:center;gap:10px}
html[data-theme="light"] header{background:rgba(244,246,251,.9)}
header h1{margin:0;font-size:17px;flex:1}
header a{color:var(--cyan);text-decoration:none;font-weight:700;font-size:13px}
main{max-width:920px;margin:0 auto;padding:16px}
button{cursor:pointer;font-family:inherit;font-size:14px;color:var(--fg);border:none;background:none}
input,textarea,select{background:var(--bg3);border:1px solid var(--border);border-radius:10px;padding:10px 12px;width:100%;color:var(--fg);outline:none;font-size:14px;font-family:inherit}
input:focus,textarea:focus,select:focus{border-color:var(--cyan)}
textarea{resize:vertical;min-height:90px}
.tabs{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}
.tabs button{padding:9px 14px;border-radius:10px;background:var(--bg2);border:1px solid var(--border);font-weight:700;font-size:13px;color:var(--fg-dim)}
.tabs button.active{background:var(--cyan);color:#001820;border-color:var(--cyan)}
.panel{display:none}
.panel.active{display:block}
.card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:14px;margin-bottom:14px}
.card h3{margin:0 0 12px;font-size:13px;color:var(--cyan);text-transform:uppercase;letter-spacing:.5px}
label{display:block;font-size:12px;color:var(--fg-dim);margin-bottom:4px;font-weight:600}
.row{margin-bottom:12px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.btn{background:var(--cyan);color:#001820;font-weight:800;padding:11px 18px;border-radius:10px}
.btn.sec{background:var(--bg3);color:var(--fg);border:1px solid var(--border)}
.btn.danger{background:var(--red);color:#fff}
.btn:hover{opacity:.9}
.map{width:100%;height:380px;border-radius:12px;border:1px solid var(--border);margin-bottom:8px}
.toolbar{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.toolbar button{padding:8px 12px;background:var(--bg2);border:1px solid var(--border);border-radius:9px;font-size:12.5px;font-weight:700}
.toolbar button.active{background:var(--cyan);color:#001820;border-color:var(--cyan)}
.steps{display:flex;gap:6px;margin-bottom:12px}
.steps div{flex:1;text-align:center;padding:8px;font-size:11px;font-weight:700;border-radius:9px;background:var(--bg2);color:var(--fg-dim);border:1px solid var(--border)}
.steps div.active{background:var(--cyan);color:#001820;border-color:var(--cyan)}
.steps div.done{background:var(--green);color:#fff;border-color:var(--green)}
.chip{padding:5px 10px;background:var(--bg3);border:1px solid var(--border);border-radius:8px;font-size:12px;display:inline-block;margin:2px}
.color-dots{display:flex;gap:8px;flex-wrap:wrap}
.color-dots button{width:32px;height:32px;border-radius:50%;border:2px solid transparent}
.color-dots button.active{border-color:#fff;box-shadow:0 0 0 2px var(--cyan)}
.list{margin-top:8px;max-height:220px;overflow-y:auto;border:1px solid var(--border);border-radius:10px;padding:6px}
.list .item{display:flex;align-items:center;gap:6px;padding:5px 8px;border-radius:6px;font-size:13px}
.list .item:hover{background:var(--bg3)}
.list .item span{flex:1}
.list .item button{color:var(--red);font-size:14px}
.progress{height:6px;background:var(--bg3);border-radius:6px;overflow:hidden;margin-top:6px}
